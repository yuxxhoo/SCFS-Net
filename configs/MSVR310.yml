MODEL:
  NAME: SCFSNet
  TRANSFORMER_TYPE: ViT-B-16
  STRIDE_SIZE:
  - 16
  - 16
  SIE_CAMERA: true
  DIRECT: 0
  SIE_COE: 1.0
  ID_LOSS_WEIGHT: 0.25
  TRIPLET_LOSS_WEIGHT: 1.0
  GLOBAL_LOCAL: true
  MULTISCALE_LOCAL_ATTENTION:
    DILATIONS:
    - 1
    - 2
    - 3
    REDUCTION: 8
    DROPOUT: 0.0
  FREQUENCY_SCALE_ROUTING:
    HIDDEN_DIM: 16
    MAX_LOGIT_BIAS: 0.1
  SCFS:
    NUM_BANDS: 5
    SPATIAL_DIM: 128
    ATTENTION_DIM: 64
    NUM_HEADS: 4
    RDDB_GROWTH: 16
    STALK_DIM: 8
    DIFFUSION_TAU: 0.1
    OUTPUT_SCALE: 0.1
    DECORRELATION_WEIGHT: 0.0
    SHEAF_ENERGY_WEIGHT: 0.0
    EPS: 1.0e-06
    USE_FSCA: true
    USE_CAFD_DISENTANGLEMENT: true
    USE_MHSR: true
    DETACH_BACKBONE: true
    USE_AUXILIARY_LOSS: false
  CLIP_PATH: pretrained/ViT-B-16.pt
INPUT:
  SIZE_TRAIN:
  - 128
  - 256
  SIZE_TEST:
  - 128
  - 256
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
DATALOADER:
  SAMPLER: softmax_triplet
  NUM_INSTANCE: 4
  NUM_WORKERS: 4
DATASETS:
  NAMES: ('MSVR310')
  ROOT_DIR: datasets
SOLVER:
  SEED: 2222
  BASE_LR: 0.00035
  WARMUP_ITERS: 10
  MAX_EPOCHS: 50
  OPTIMIZER_NAME: Adam
  GAMMA: 0.1
  IMS_PER_BATCH: 64
  EVAL_PERIOD: 1
TEST:
  IMS_PER_BATCH: 64
  RE_RANKING: 'no'
  WEIGHT: ''
  NECK_FEAT: before
  FEAT_NORM: 'yes'
  MISS: nothing
OUTPUT_DIR: outputs/MSVR310
